name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            lmodern poppler-utils

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - uses: actions/configure-pages@v5

      - name: Build site
        run: mkdocs build

      - name: Cache PDF renders
        uses: actions/cache@v4
        with:
          path: .pdf-cache
          key: pdf-cache-${{ hashFiles('docs/**', 'pdf/**', 'mkdocs.yml') }}
          restore-keys: |
            pdf-cache-

      - name: Build per-section PDFs
        run: python3 pdf/build.py --repo . --out site --cache .pdf-cache

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
